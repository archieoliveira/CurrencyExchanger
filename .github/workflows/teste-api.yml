name: Run Playwright Tests and Commit Logs

on:
  push:
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test-api-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências e Playwright
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Build backend
        run: dotnet build --configuration Release

      - name: Start backend and run Playwright tests
        run: |
          dotnet run --project ConverterAPI.csproj --urls "http://localhost:5133" &
          for i in {1..15}; do
            nc -z localhost 5133 && break
            sleep 1
          done
          npx playwright test

      - name: Configurar Git para commit automático
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit dos logs e respostas
        if: success()
        run: |
          if [ -d "test-results" ]; then
            git add test-results/*
            git commit -m "ci: salvar logs e resposta após testes"
            git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git
            git push
          fi
        env:
          GH_PAT: ${{ secrets.GH_PAT }}