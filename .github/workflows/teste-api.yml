name: Run Playwright Tests and Commit Logs

on:
  push:
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
    branches:
      - main

jobs:
  test-api-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências e Playwright
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Rodar testes Playwright
        run: npx playwright test

      - name: Configurar Git para commit automático
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit dos logs e respostas
        if: success()
        run: |
          if [ -d "test-results" ]; then
            git add test-results/*
            git commit -m "ci: salvar logs e resposta após testes"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
